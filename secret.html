<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8e6bd8">
<title>秘密帳本</title>
<style>
  :root {
    --bg: #f6f1ff; --card: #fff; --ink: #34295a; --muted: #9389ad;
    --in: #2e9d5b; --out: #e0533d; --accent: #8e6bd8; --line: #e9e1fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 18px; -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
  .hidden { display: none !important; }
  button { font: inherit; border: 0; border-radius: 14px; cursor: pointer; color: inherit; }
  input { font: inherit; width: 100%; padding: 14px; border: 2px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); }
  input:focus { outline: none; border-color: var(--accent); }
  a { color: var(--accent); }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 21px; margin: 0; }
  .link-btn { background: none; color: var(--muted); font-size: 15px; padding: 6px 8px; text-decoration: none; }

  .balance { background: var(--accent); color: #fff; border-radius: 24px; padding: 20px; margin: 16px 0; text-align: center; box-shadow: 0 4px 0 #7656c0; }
  .balance .label { opacity: .85; font-size: 16px; }
  .balance .amount { font-size: 52px; font-weight: 800; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions button { padding: 16px; font-size: 21px; font-weight: 700; color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .btn-in { background: var(--in); }
  .btn-out { background: var(--out); }

  .card { background: var(--card); border-radius: 20px; padding: 16px; margin-top: 16px; }
  .month { display: flex; align-items: center; justify-content: space-between; }
  .month button { background: var(--line); width: 40px; height: 40px; font-size: 20px; }
  .month .title { font-weight: 700; font-size: 19px; }
  .sums { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 6px; text-align: center; }
  .sums div { background: var(--bg); border-radius: 14px; padding: 10px; }
  .sums small { color: var(--muted); display: block; font-size: 14px; }
  .sums b { font-size: 22px; }
  .bar-row { display: grid; grid-template-columns: 88px 1fr 64px; align-items: center; gap: 8px; margin-top: 10px; font-size: 16px; }
  .bar { height: 14px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .bar-row .v { text-align: right; font-weight: 700; }
  .muted { color: var(--muted); font-size: 15px; text-align: center; padding: 10px 0 2px; }

  .day { color: var(--muted); font-size: 14px; margin: 14px 4px 6px; }
  .list { background: var(--card); border-radius: 20px; overflow: hidden; }
  .item { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item .emo { font-size: 26px; text-align: center; }
  .item .note { font-weight: 600; word-break: break-word; }
  .item .cat { color: var(--muted); font-size: 14px; }
  .item .money { font-weight: 800; font-size: 19px; }
  .money.in { color: var(--in); } .money.out { color: var(--out); }

  /* PIN screen */
  .pin { text-align: center; padding-top: 36px; }
  .pin .icon { font-size: 54px; }
  .pin h2 { margin: 8px 0 4px; font-size: 23px; }
  .pin p { color: var(--muted); margin: 4px 0 0; min-height: 24px; font-size: 16px; }
  .dots { display: flex; justify-content: center; gap: 16px; margin: 26px 0; }
  .dots span { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent); }
  .dots span.on { background: var(--accent); }
  .dots.shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  .keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px 22px; justify-content: center; }
  .keypad button { height: 76px; border-radius: 50%; background: var(--card); font-size: 30px; font-weight: 600; box-shadow: 0 3px 0 var(--line); }
  .keypad button:active { background: var(--line); }
  .keypad .blank { visibility: hidden; }
  .pin .link-btn { margin-top: 22px; text-decoration: underline; }

  /* sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(30,20,60,.35); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--bg); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 10px; font-size: 22px; }
  .sheet label { display: block; color: var(--muted); font-size: 15px; margin: 12px 0 6px; }
  .sheet .big { font-size: 30px; font-weight: 800; text-align: center; }
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cats button { background: #fff; border: 2px solid var(--line); padding: 8px 2px; font-size: 14px; line-height: 1.3; }
  .cats button span { display: block; font-size: 28px; }
  .cats button.on { border-color: var(--accent); background: var(--line); font-weight: 700; }
  .sheet .row { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 18px; }
  .sheet .row button { padding: 15px; font-size: 19px; font-weight: 700; }
  .btn-cancel { background: var(--line); }
  .btn-save { background: var(--accent); color: #fff !important; }
  .btn-del { width: 100%; margin-top: 10px; padding: 12px; background: none; color: var(--out); font-size: 16px; }

  .notice { background: var(--card); border-radius: 24px; padding: 28px; margin-top: 50px; text-align: center; }
  .notice .icon { font-size: 54px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 15px; z-index: 20; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">

  <section id="noCode" class="notice hidden">
    <div class="icon">🔒</div>
    <p>要先加入家裡的共同帳本,才能使用秘密帳本喔。<br>請打開家人分享給你的連結。</p>
    <p><a href="./">← 回共同帳本</a></p>
  </section>

  <section id="loading" class="notice">
    <div class="icon">🔒</div>
    <p>讀取中…</p>
  </section>

  <section id="pin" class="pin hidden">
    <div class="icon">🔒</div>
    <h2 id="pinTitle"></h2>
    <p id="pinSub"></p>
    <div id="dots" class="dots"></div>
    <div id="keypad" class="keypad"></div>
    <button id="pinLink" class="link-btn"></button>
    <div><a href="./" class="link-btn">← 回共同帳本</a></div>
  </section>

  <section id="main" class="hidden">
    <header>
      <h1 id="title">🔒 秘密帳本</h1>
      <div>
        <a href="./" class="link-btn">共同帳本</a>
        <button id="lockBtn" class="link-btn">上鎖</button>
      </div>
    </header>

    <div class="balance">
      <div class="label">我的存款</div>
      <div id="balance" class="amount">$0</div>
    </div>

    <div class="actions">
      <button class="btn-in" data-kind="in">➕ 收入</button>
      <button class="btn-out" data-kind="out">➖ 花費</button>
    </div>

    <div class="card">
      <div class="month">
        <button id="prevMonth" aria-label="上個月">‹</button>
        <div id="monthTitle" class="title"></div>
        <button id="nextMonth" aria-label="下個月">›</button>
      </div>
      <div class="sums">
        <div><small>這個月收入</small><b id="sumIn" class="money in">$0</b></div>
        <div><small>這個月花費</small><b id="sumOut" class="money out">$0</b></div>
      </div>
      <div id="bars"></div>
    </div>

    <div id="list"></div>
  </section>
</div>

<div id="sheet" class="sheet-bg hidden">
  <form id="entryForm" class="sheet">
    <h3 id="sheetTitle"></h3>
    <label>分類</label>
    <div id="cats" class="cats"></div>
    <label for="amountInput">金額</label>
    <input id="amountInput" class="big" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off">
    <label for="noteInput">說明(可以不寫)</label>
    <input id="noteInput" maxlength="100" placeholder="例如:珍珠奶茶" autocomplete="off">
    <label for="dateInput">日期</label>
    <input id="dateInput" type="date">
    <div class="row">
      <button type="button" class="btn-cancel" id="cancelBtn">取消</button>
      <button type="submit" class="btn-save">記下來</button>
    </div>
    <button type="button" id="deleteBtn" class="btn-del hidden">🗑 刪除這筆</button>
  </form>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module">
// Same public Firebase config as index.html. The secret ledger lives at
// secrets/{familyCode}; the PIN is a lock screen, not encryption, so a parent
// with the backup code can reset it.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDr8Q6AhXBuAQOUhTlxMOqReHjsZyk-hlE",
  authDomain: "wallet-8fbbe.firebaseapp.com",
  projectId: "wallet-8fbbe",
  storageBucket: "wallet-8fbbe.firebasestorage.app",
  messagingSenderId: "507361826551",
  appId: "1:507361826551:web:a63962fcba13573ea9e5f2",
};

const CATS = {
  out: [
    { id: "eat", e: "🍙", n: "吃" },
    { id: "drink", e: "🧋", n: "喝" },
    { id: "play", e: "🎮", n: "玩" },
    { id: "fun", e: "🎡", n: "樂" },
    { id: "stationery", e: "✏️", n: "文具" },
    { id: "book", e: "📚", n: "書" },
    { id: "gift", e: "🎁", n: "送禮" },
    { id: "other", e: "📦", n: "其他" },
  ],
  in: [
    { id: "allowance", e: "💰", n: "零用錢" },
    { id: "redenvelope", e: "🧧", n: "紅包" },
    { id: "reward", e: "⭐", n: "獎勵" },
    { id: "other_in", e: "📦", n: "其他" },
  ],
};
const CAT = Object.fromEntries([...CATS.out, ...CATS.in].map((c) => [c.id, c]));
const catOf = (id) => CAT[id] || { e: "📦", n: "其他" };

const SDK = "https://www.gstatic.com/firebasejs/11.0.2";
const $ = (id) => document.getElementById(id);
const code = localStorage.getItem("wallet.code");

let fs, db, metaRef, entriesRef, unsubEntries;
let meta;            // undefined = loading, null = not created yet
let unlocked = false;
let entries = [];
let viewMonth = new Date(); viewMonth.setDate(1);
let sheetKind = "out", sheetCat = null, editing = null;

// ---------- helpers ----------
function show(id) {
  for (const s of ["noCode", "loading", "pin", "main"]) $(s).classList.toggle("hidden", s !== id);
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.add("hidden"), 2200);
}
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("zh-TW");
const signed = (n) => (n > 0 ? "+" : "−") + Math.abs(n).toLocaleString("zh-TW");
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const sameMonth = (d, m) => d.getFullYear() === m.getFullYear() && d.getMonth() === m.getMonth();
async function sha(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
}
const pinHash = (pin) => sha(code + ":pin:" + pin);
const backupHash = (b) => sha(code + ":backup:" + b);

// ---------- PIN pad ----------
let pinState = null; // { len, value, onDone, link }
function askPin({ title, sub = "", len = 4, link = null }) {
  return new Promise((resolve) => {
    pinState = { len, value: "", onDone: resolve };
    $("pinTitle").textContent = title;
    $("pinSub").textContent = sub;
    $("pinLink").classList.toggle("hidden", !link);
    if (link) { $("pinLink").textContent = link.text; $("pinLink").onclick = link.onClick; }
    drawDots();
    show("pin");
  });
}
function drawDots() {
  $("dots").innerHTML = Array.from({ length: pinState.len }, (_, i) => `<span class="${i < pinState.value.length ? "on" : ""}"></span>`).join("");
}
function shake(msg) {
  const d = $("dots");
  d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
  if (msg) $("pinSub").textContent = msg;
}
function pressKey(k) {
  if (!pinState || $("pin").classList.contains("hidden")) return;
  if (k === "del") pinState.value = pinState.value.slice(0, -1);
  else if (pinState.value.length < pinState.len) pinState.value += k;
  drawDots();
  if (pinState.value.length === pinState.len) {
    const { value, onDone } = pinState;
    setTimeout(() => onDone(value), 120);
  }
}
$("keypad").innerHTML = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"]
  .map((k) => k ? `<button type="button" data-k="${k}">${k === "del" ? "⌫" : k}</button>` : `<button class="blank" tabindex="-1"></button>`)
  .join("");
$("keypad").addEventListener("click", (e) => { const k = e.target.dataset.k; if (k) pressKey(k); });
document.addEventListener("keydown", (e) => {
  if (/^\d$/.test(e.key)) pressKey(e.key);
  else if (e.key === "Backspace") pressKey("del");
});
// Ask for a new code twice until both entries match.
async function askNew(title, sub, len) {
  for (;;) {
    const a = await askPin({ title, sub, len });
    const b = await askPin({ title: "再輸入一次確認", sub: "", len });
    if (a === b) return a;
    sub = "兩次不一樣,重新設定一次";
    // askPin redraws empty dots; shake them so the mismatch is felt.
    setTimeout(() => shake(), 0);
  }
}

// ---------- flows ----------
async function createFlow() {
  const owner = localStorage.getItem("wallet.name") || "我";
  const pin = await askNew("設定你的秘密 PIN", "想一組 4 位數字,只有你知道", 4);
  const backup = await askNew("請媽媽輸入備用碼", "6 位數字,忘記 PIN 時媽媽可以幫你重設", 6);
  await fs.setDoc(metaRef, { owner, pinHash: await pinHash(pin), backupHash: await backupHash(backup) });
  toast("秘密帳本建立好了!記得你的 PIN 喔");
  unlock();
}

async function lockFlow() {
  unlocked = false;
  $("list").innerHTML = "";
  // Switching to another flow replaces pinState, so this loop's pending promise
  // simply never resolves.
  let sub = "輸入 PIN 解鎖";
  for (;;) {
    const pin = await askPin({
      title: `${meta.owner} 的秘密帳本`, sub, len: 4,
      link: { text: "忘記 PIN?", onClick: forgotFlow },
    });
    if ((await pinHash(pin)) === meta.pinHash) return unlock();
    shake();
    sub = "PIN 不對,再試一次";
  }
}

async function forgotFlow() {
  let sub = "6 位數字";
  for (;;) {
    const b = await askPin({ title: "請媽媽輸入備用碼", sub, len: 6, link: { text: "取消", onClick: lockFlow } });
    if ((await backupHash(b)) === meta.backupHash) break;
    shake();
    sub = "備用碼不對,再試一次";
  }
  const pin = await askNew("設定新的 PIN", "想一組新的 4 位數字", 4);
  await fs.setDoc(metaRef, { ...meta, pinHash: await pinHash(pin) });
  toast("PIN 已經重設好了");
  unlock();
}

function unlock() {
  unlocked = true;
  pinState = null;
  $("title").textContent = `🔒 ${meta ? meta.owner : ""} 的秘密帳本`;
  show("main");
  if (!unsubEntries) {
    unsubEntries = fs.onSnapshot(fs.query(entriesRef, fs.orderBy("ts", "desc")), (snap) => {
      entries = snap.docs.map((d) => {
        const x = d.data();
        return { id: d.id, ...x, date: x.ts.toDate() };
      });
      if (unlocked) render();
    }, (err) => { console.error(err); toast("讀不到秘密帳本:" + (err.code || err.message)); });
  }
  render();
}

function lock() {
  if (!unlocked) return;
  closeSheet();
  lockFlow();
}
$("lockBtn").onclick = lock;
document.addEventListener("visibilitychange", () => { if (document.hidden) lock(); });

// ---------- render ----------
function render() {
  if (!unlocked) return;
  $("balance").textContent = money(entries.reduce((s, e) => s + e.amount, 0));
  $("monthTitle").textContent = `${viewMonth.getFullYear()} 年 ${viewMonth.getMonth() + 1} 月`;

  const month = entries.filter((e) => sameMonth(e.date, viewMonth));
  const inSum = month.filter((e) => e.amount > 0).reduce((s, e) => s + e.amount, 0);
  const outSum = month.filter((e) => e.amount < 0).reduce((s, e) => s - e.amount, 0);
  $("sumIn").textContent = money(inSum);
  $("sumOut").textContent = money(outSum);

  const byCat = {};
  for (const e of month) if (e.amount < 0) byCat[e.cat] = (byCat[e.cat] || 0) - e.amount;
  const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = rows.length ? rows[0][1] : 1;
  $("bars").innerHTML = rows.length
    ? rows.map(([id, v]) => {
        const c = catOf(id);
        return `<div class="bar-row"><div>${c.e} ${c.n}</div><div class="bar"><i style="width:${Math.max(4, (v / max) * 100)}%"></i></div><div class="v">${money(v)}</div></div>`;
      }).join("")
    : `<div class="muted">這個月還沒有花錢</div>`;

  if (!month.length) { $("list").innerHTML = `<div class="day">這個月還沒有紀錄</div>`; return; }
  const days = [];
  for (const e of month) {
    const k = ymd(e.date);
    if (!days.length || days[days.length - 1].k !== k) days.push({ k, d: e.date, items: [] });
    days[days.length - 1].items.push(e);
  }
  const wk = "日一二三四五六";
  $("list").innerHTML = days.map((g) => `
    <div class="day">${g.d.getMonth() + 1}/${g.d.getDate()}(${wk[g.d.getDay()]})</div>
    <div class="list">${g.items.map((e) => {
      const c = catOf(e.cat);
      return `<div class="item" data-id="${e.id}">
        <div class="emo">${c.e}</div>
        <div><div class="note">${esc(e.note || c.n)}</div><div class="cat">${c.n}</div></div>
        <div class="money ${e.amount > 0 ? "in" : "out"}">${signed(e.amount)}</div>
      </div>`;
    }).join("")}</div>`).join("");
}
$("prevMonth").onclick = () => { viewMonth.setMonth(viewMonth.getMonth() - 1); render(); };
$("nextMonth").onclick = () => { viewMonth.setMonth(viewMonth.getMonth() + 1); render(); };

// ---------- sheet ----------
function openSheet(kind, entry = null) {
  editing = entry;
  sheetKind = kind;
  sheetCat = entry ? entry.cat : CATS[kind][0].id;
  $("sheetTitle").textContent = (entry ? "修改" : "") + (kind === "in" ? "➕ 收入" : "➖ 花費");
  $("amountInput").value = entry ? Math.abs(entry.amount) : "";
  $("noteInput").value = entry ? entry.note : "";
  $("dateInput").value = ymd(entry ? entry.date : new Date());
  $("deleteBtn").classList.toggle("hidden", !entry);
  drawCats();
  $("sheet").classList.remove("hidden");
  if (!entry) setTimeout(() => $("amountInput").focus(), 50);
}
function drawCats() {
  $("cats").innerHTML = CATS[sheetKind].map((c) =>
    `<button type="button" data-cat="${c.id}" class="${c.id === sheetCat ? "on" : ""}"><span>${c.e}</span>${c.n}</button>`).join("");
}
const closeSheet = () => { $("sheet").classList.add("hidden"); editing = null; };

$("cats").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) { sheetCat = b.dataset.cat; drawCats(); }
});
document.querySelectorAll(".actions button").forEach((b) => (b.onclick = () => openSheet(b.dataset.kind)));
$("list").addEventListener("click", (e) => {
  const row = e.target.closest(".item");
  const entry = row && entries.find((x) => x.id === row.dataset.id);
  if (entry) openSheet(entry.amount > 0 ? "in" : "out", entry);
});
$("cancelBtn").onclick = closeSheet;
$("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") closeSheet(); });

$("entryForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const n = parseInt($("amountInput").value.replace(/[^\d]/g, ""), 10);
  if (!n || n > 100000) { toast("請輸入 1 到 100,000 的金額"); return; }
  const [y, m, d] = $("dateInput").value.split("-").map(Number);
  let date;
  if (editing && ymd(editing.date) === $("dateInput").value) date = editing.date;
  else if (y && ymd(new Date()) === $("dateInput").value) date = new Date();
  else if (y) date = new Date(y, m - 1, d, 12);
  else date = new Date();
  const data = {
    amount: sheetKind === "in" ? n : -n,
    cat: sheetCat,
    note: $("noteInput").value.trim(),
    ts: fs.Timestamp.fromDate(date),
  };
  const p = editing ? fs.setDoc(fs.doc(entriesRef, editing.id), data) : fs.addDoc(entriesRef, data);
  p.catch((err) => { console.error(err); toast("沒有存成功:" + (err.code || err.message)); });
  toast(editing ? "改好了" : `記下${sheetKind === "in" ? "收入" : "花費"} ${n} 元`);
  if (!sameMonth(date, viewMonth)) { viewMonth = new Date(date.getFullYear(), date.getMonth(), 1); }
  closeSheet();
  render();
});
$("deleteBtn").onclick = () => {
  if (!editing || !confirm("確定要刪除這筆嗎?")) return;
  fs.deleteDoc(fs.doc(entriesRef, editing.id)).catch((err) => toast("沒有刪除成功:" + (err.code || err.message)));
  closeSheet();
  toast("刪除了");
};

// ---------- boot ----------
if (!code) {
  show("noCode");
} else {
  const [{ initializeApp }, firestore] = await Promise.all([
    import(`${SDK}/firebase-app.js`),
    import(`${SDK}/firebase-firestore.js`),
  ]);
  fs = firestore;
  db = fs.initializeFirestore(initializeApp(FIREBASE_CONFIG), {
    localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }),
  });
  metaRef = fs.doc(db, "secrets", code);
  entriesRef = fs.collection(metaRef, "entries");
  let first = true;
  fs.onSnapshot(metaRef, (snap) => {
    // Wait for the server's answer before deciding the ledger doesn't exist yet.
    if (!snap.exists() && snap.metadata.fromCache) return;
    meta = snap.exists() ? snap.data() : null;
    if (!first) return;
    first = false;
    meta ? lockFlow() : createFlow();
  }, (err) => {
    console.error(err);
    $("loading").querySelector("p").textContent = "讀不到秘密帳本:" + (err.code || err.message);
  });
}
</script>
</body>
</html>
